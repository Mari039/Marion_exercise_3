<!DOCTYPE html>
<html lang="en">    
    <head>
        <meta charset="UTF-8">
        <title>Booking Reservation</title>
        <link rel="stylesheet" href="Style_for_Final_Booking.css">
    </head>
    <body class="body">
<header class="header">
    <h1 >Hailey's Hotel</h1>
    <p></p><br>
    <p></p><br>
    <p class="header1">Almost There!</p>
</header>
<div class="midsection1a">
    <div class="Background-Img-round1a">
        <img class="resize" src="Images/bedroom1.png" alt="Bedroom with two beds with window and a triangle ceiling" >   <!-- Resize is a CSS attribute that changes the sizes for Images-->
        <div class="resize_pre"> <!-- resize_pre is a CSS attribute that changes the size for letters-->
            <p>Booking Details</p>
            <p>Check in 02/03/2025 - Check out 03/03/2025 </p>
            <p>Queen Suite</p>
            <p>x2 Adult</p>
            <p>Total Length stay: 1</p>
            <p>Total Price      :£150</p>
        </div>
    </div>
    <p></p>
</div> 
 <div class="midsection1b">
    <div class="Background-Img-round1b">
        <form action="Book_Confirmation_King.html">
            <p></p><br>
            <label for="title">Title:</label><br>
            <input type="text" id="title" name="title" class="form-control"><br>
            <p></p>
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" class="form-control"><br>
            <p></p>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" class="form-control"><br>
            <p></p>
            <label for="number">Number:</label><br>
            <input type="text" id="number" name="number" class="form-control"><br>
            <p></p>
            <label for="number">Card number:</label>
            <input type="text" class="form-control1" id="Cardnumber" name="Card number" >
            <label for="number">Expiry :</label>
            <input type="text" class="form-control1" id="Expiry" name="Expiry" >
            <label for="number">cvv :</label>
            <input type="text" class="form-control1" id="cvv" name="cvv" >
            <p></p>
            <label for="Special_Request">Special Request:</label><br>
            <textarea id="Special_Request" name="Special_Request" rows="8" class="form-control"></textarea><br>
            <p></p><br>
            <input type="button" value="Back" class="back-button" onclick="history.go(-1)"/>
            <input type="submit" value="Submit" class="submit-button">    
        <p></p><br>
        </form>
</div>
</div>  
</body>
</html>
